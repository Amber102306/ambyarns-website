<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambyarns · Handmade Plaid Goods</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="announcement-bar">✨ FREE STICKER WITH EVERY ORDER OVER ₱500 · PICK UP AT SM FAIRVIEW & SM CALOOCAN ✨</div>

  <header>
    <div class="container nav-bar">
      <div class="logo-area" onclick="window.loadPage('home')">
        <div class="logo-placeholder">LOGO</div>
        <span class="logo-text">Ambyarns</span>
      </div>

      <nav>
        <ul>
          <li><a href="#" data-page="home" class="active">Home</a></li>
          <li><a href="#" data-page="order">Shop</a></li>
          <li><a href="#" data-page="about">Our Story</a></li>
          <!-- Admin link starts hidden -->
          <li id="adminNavLink" style="display: none;"><a href="#" data-page="admin">Admin</a></li>
        </ul>
      </nav>

      <div style="display: flex; gap: 16px; align-items: center;">
        <span id="authBtn" onclick="window.openAuthModal()" style="cursor: pointer; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--brand-dark);">Log In</span>
        <div class="cart-icon-wrapper" onclick="window.loadPage('cart')" style="cursor: pointer; position: relative; font-size: 1.2rem;">
          <i class="fas fa-shopping-bag"></i>
          <span id="cartBadge" class="notification-badge" style="display:none; position: absolute; top: -8px; right: -12px;">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- LOGIN MODAL -->
  <div id="authModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #fff; padding: 32px; border-radius: 8px; width: 90%; max-width: 400px;">
      <h2 style="margin-bottom: 24px;">Admin Login</h2>
      <form onsubmit="window.handleLogin(event)">
        <div class="form-group"><label>Email</label><input type="email" id="authEmail" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="authPassword" required></div>
        <button type="submit" class="btn" style="width: 100%;">Log In</button>
      </form>
      <div style="text-align: center; margin-top: 16px;">
        <a href="#" onclick="window.handleRegister()" style="font-size: 0.8rem; color: var(--brand-primary); text-decoration: underline;">Create an account</a>
      </div>
      <button onclick="document.getElementById('authModal').style.display='none'" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>
  </div>

  <main class="container" id="mainContainer"></main>

  <footer>
    <div class="container">
      <div class="footer-brand">Ambyarns</div>
      <div class="footer-copy">© 2025 Ambyarns</div>
    </div>
  </footer>

  <!-- FIREBASE V10 SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // PASTE YOUR CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "ambyarns-website.firebaseapp.com",
      projectId: "ambyarns-website",
      storageBucket: "ambyarns-website.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.firebaseDB = db;
    window.firebaseAuth = auth;
    window.firebaseCollection = collection;
    window.firebaseAddDoc = addDoc;
    window.firebaseOnSnapshot = onSnapshot;
    window.firebaseDoc = doc;
    window.firebaseUpdateDoc = updateDoc;
    window.firebaseDeleteDoc = deleteDoc;
    window.firebaseSignIn = signInWithEmailAndPassword;
    window.firebaseCreateUser = createUserWithEmailAndPassword;
    window.onAuthStateChanged = onAuthStateChanged;
    window.firebaseSignOut = signOut;
  </script>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
  <script src="js/order.js"></script>
  <script src="js/about.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

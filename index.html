<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambyarns · Handmade Plaid Goods</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="announcement-bar">✨ FREE STICKER WITH EVERY ORDER OVER ₱500 · PICK UP AT SM FAIRVIEW & SM CALOOCAN ✨</div>

  <header>
    <div class="container nav-bar">
      <div class="logo-area" onclick="window.loadPage('home')">
        <div class="logo-placeholder">LOGO</div>
        <span class="logo-text">Ambyarns</span>
      </div>

      <nav>
        <ul>
          <li><a href="#" data-page="home" class="active">Home</a></li>
          <li><a href="#" data-page="order">Shop</a></li>
          <li><a href="#" data-page="about">Our Story</a></li>
          <li id="adminNavLink" style="display: none;"><a href="#" data-page="admin">Admin</a></li>
        </ul>
      </nav>

      <div style="display: flex; gap: 16px; align-items: center;">
        <span id="authBtn" onclick="window.openAuthPage()" style="cursor: pointer; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--brand-dark);">Log In</span>
        <div class="cart-icon-wrapper" onclick="window.loadPage('cart')" style="cursor: pointer; position: relative; font-size: 1.2rem;">
          <i class="fas fa-shopping-bag"></i>
          <span id="cartBadge" class="notification-badge" style="display:none; position: absolute; top: -8px; right: -12px;">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="mainContainer" style="min-height: 60vh;"></main>

  <footer>
    <div class="container">
      <div class="footer-brand">Ambyarns</div>
      <div class="footer-copy">© 2025 Ambyarns</div>
    </div>
  </footer>

  <!-- FIREBASE SCRIPTS (Loaded first) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.firebaseDB = db;
    window.firebaseAuth = auth;
    window.firebaseCollection = collection;
    window.firebaseAddDoc = addDoc;
    window.firebaseOnSnapshot = onSnapshot;
    window.firebaseDoc = doc;
    window.firebaseUpdateDoc = updateDoc;
    window.firebaseDeleteDoc = deleteDoc;
    window.firebaseSignIn = signInWithEmailAndPassword;
    window.firebaseCreateUser = createUserWithEmailAndPassword;
    window.onAuthStateChanged = onAuthStateChanged;
    window.firebaseSignOut = signOut;

    // Tell the app Firebase is ready so it can load the home page
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
  <script src="js/order.js"></script>
  <script src="js/about.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

<section class="hero" style="padding: 40px 0 20px;">
  <h1>Checkout</h1>
</section>

<div class="card" style="max-width: 700px; margin: 0 auto 80px auto; padding: 32px; background: #fff; border: 1px solid var(--brand-border);">
  <div id="orderSummary"></div>
  
  <form id="orderForm">
    <div class="form-group">
      <label>Email or Facebook link (for contact)</label>
      <input type="text" id="contactInfo" placeholder="email@example.com or fb.com/yourprofile" required>
    </div>
    
    <div class="form-group">
      <label>Payment method</label>
      <div class="radio-group">
        <label><input type="radio" name="payment" value="cash" checked> Cash</label>
        <label><input type="radio" name="payment" value="gcash"> GCash</label>
      </div>
    </div>
    
    <div id="gcashSection" style="display: none;">
      <div class="qr-placeholder">
        <i class="fas fa-qrcode"></i>
        <p>Scan QR to pay: <strong>0917 123 4567</strong> (Ambyarns)</p>
        <p style="font-size: 0.85rem; margin-top: 8px;">After payment, paste your reference number below.</p>
      </div>
      <div class="form-group">
        <label>Proof of payment (reference / screenshot link)</label>
        <input type="text" id="gcashProof" placeholder="e.g. Ref 12345 or image link">
      </div>
    </div>
    
    <div class="form-group">
      <label>Pick-up place (if cash or for meetup)</label>
      <select id="pickupPlace">
        <option value="SM Fairview">SM Fairview</option>
        <option value="SM Caloocan">SM Caloocan</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Mode of receiving</label>
      <div class="radio-group">
        <label><input type="radio" name="receiveMode" value="pickup" checked> Pick up</label>
        <label><input type="radio" name="receiveMode" value="courier"> Courier (delivery fee handled by you)</label>
      </div>
      <p style="font-size: 0.85rem; margin-top: 8px; color: var(--brand-primary);">
        <i class="fas fa-truck"></i> Courier: You will shoulder the delivery fee upon delivery.
      </p>
    </div>
    
    <button type="submit" class="btn" style="width: 100%;"><i class="fas fa-check"></i> Place Order</button>
  </form>
</div>

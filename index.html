<!DOCTYPE html>
<html lang="en">

<body>

  <div class="announcement-bar">

          <i class="fas fa-image"></i> LOGO
        </div>
        <span class="logo-text">Ambyarns</span>
      </div>

      <nav>
        <ul>
          <li><a href="#" data-page="home" class="active">Home</a></li>
          <li><a href="#" data-page="order">Shop</a></li>

          <li><a href="#" data-page="admin">Admin <span id="adminNotif" class="notification-badge" style="display:none;">0</span></a></li>
